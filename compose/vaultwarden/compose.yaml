services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:?Set VAULTWARDEN_IMAGE to an exact version or digest}
    restart: unless-stopped
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED:-true}
      SHOW_PASSWORD_HINT: 'false'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${VAULTWARDEN_PORT:-8082}:80'
    volumes:
      - vaultwarden_data:/data
    healthcheck:
      test: ['CMD', '/healthcheck.sh']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - frontend

volumes:
  vaultwarden_data:

networks:
  frontend:
