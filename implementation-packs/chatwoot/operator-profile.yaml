  - emergency-response
  - payment-data
  - identity-verification
  - autonomous-dispute-resolution
evidence_required:
  - role-and-message-tests
  - open-case-reconciliation
  - export-or-restore-record
untested_limitations:
  - all-edition-runtime-and-channel-behavior
