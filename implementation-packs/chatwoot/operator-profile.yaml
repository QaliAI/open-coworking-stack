tool_id: chatwoot
pack_status: documentation-reviewed-runtime-untested
pilot_outcome: one-week-two-agent-website-inbox
accountable_owner: inbox-owner
responsible_operators:
  - community-agent
  - sales-agent
required_reviewers:
  - privacy-reviewer
  - website-owner
  - technical-recovery-owner
  - after-hours-manager
minimum_skills:
  - inbox-operations
  - customer-communication
  - privacy-and-retention
