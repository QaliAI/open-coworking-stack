schema_version: 1.0.0
id: operate-event-day
name: Operate event day
description: Execute the approved plan, coordinate arrivals and transitions, monitor safety and member impact, and adapt through named human decision-makers as real conditions change.
business_area: events
primary_role: event-manager
supporting_roles: [community-coordinator-front-desk, operations-facilities-manager, general-manager]
frequency: event-driven
trigger: Event setup begins and operational control transfers to the event-day team.
inputs: [Approved run of show, Live attendance and site conditions, Contact and contingency plan]
outputs: [Coordinated delivery, Logged material changes and incidents, Safe handback of space]
current_manual_methods: [Radio and chat coordination, Printed plan, Event lead memory]
common_failure_modes:
  [
    Schedule pressure overrides a safety control,
    Unrecorded live change leaves another team unprepared,
  ]
human_judgment_required:
  [
    Adapt timing and resources to live conditions,
    Pause or stop activity when controls are ineffective,
  ]
approval_points: [Named duty leader approves material deviations and stop or restart decisions]
privacy_sensitivity: medium
security_sensitivity: high
compliance_review_needed: true
success_metrics:
  [
    Material deviations receive explicit ownership,
    Event closes with people and space safely accounted for,
  ]
related_workflows: [event-lifecycle, incident-response]
