schema_version: 1.0.0
id: review-access-logs
name: Review access logs
description: Examine defined physical and digital access exceptions for operational or security purposes using proportionate scope, documented authority, and contextual human investigation.
business_area: access-network-printing
primary_role: it-security-administrator
supporting_roles: [general-manager]
frequency: weekly
trigger: Scheduled exception review or an authorized incident investigation.
inputs:
  [Approved review purpose and scope, Access events and entitlement records, Relevant site context]
outputs:
  [Explained or escalated exceptions, Corrective access actions, Review evidence and deletion date]
current_manual_methods: [Export all logs, Search by person, Review only after incident]
common_failure_modes:
  [Normal unusual behavior is treated as misconduct, Logs are retained or shared beyond purpose]
human_judgment_required:
  [
    Interpret events against access and site context,
    Distinguish configuration error from suspicious conduct,
  ]
approval_points:
  [
    Security or privacy owner approves purpose and scope; employment matters use separate authorized review,
  ]
privacy_sensitivity: high
security_sensitivity: high
compliance_review_needed: true
success_metrics:
  [
    Reviews remain within approved scope,
    Exceptions lead to evidence-based action or documented closure,
  ]
related_workflows: [access-provisioning, incident-response, compliance-review]
