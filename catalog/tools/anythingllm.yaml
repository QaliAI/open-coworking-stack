  - self-hosted
maturity: stable
license:
  class: oss-osi-approved
  spdx: MIT
  source_url: https://github.com/Mintplex-Labs/anything-llm/blob/master/LICENSE
  notes: >-
    MIT license applies to the linked core project. Check any model,
    deployment, connector and hosted edition terms independently.
  verified_on: 2026-11-11
cost:
  model: free-self-hosted
  summary: >-
    Self-hosted software is MIT licensed. An actual AI assistant may require
    local model compute or paid model APIs, embeddings, hosting, maintenance
    and document governance.
  currency_caveat: Do not represent third-party models or hosting as free.
  confidence: partially-verified
implementation:
  difficulty: moderate
  maintenance_burden: medium
  skills_required:
    - document-governance
    - user-permissions
    - ai-model-configuration
  smallest_useful_experiment: >-
    Start with five fictional, approved coworking SOPs; ask ten questions
    including two unknowns and one contradictory policy; confirm access
    controls, citations and refusal before considering real staff records.
homepage: https://anythingllm.com/
repository: https://github.com/Mintplex-Labs/anything-llm
documentation: https://docs.anythingllm.com/
links:
