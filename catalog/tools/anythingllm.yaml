schema_version: 1.0.0
id: anythingllm
name: AnythingLLM
tagline: Local-first AI assistant that can answer questions from approved SOPs
description: >-
  AnythingLLM is a self-hostable AI chat and retrieval platform that can
  ingest operator-approved documents to answer questions about staff
  procedures, amenities and policies. A coworking space can pilot a
  read-only internal knowledge assistant with sourced answers. It is not
  automatically connected to memberships or an authoritative policy system.
status: active
