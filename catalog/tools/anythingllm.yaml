  - label: Official documentation
    url: https://docs.anythingllm.com/
    kind: docs
tasks_reduced_or_augmented:
  - Locate approved front-desk procedures and membership FAQ answers
  - Reduce repeated internal questions about published staff policies
human_oversight_still_needed:
  - Approve and version the underlying source documents
  - Handle emergencies, contracts, access exceptions and policy conflicts
data_privacy:
  data_held:
    - approved internal documents
    - embeddings and retrieval indexes
    - user queries and answer history
  personal_data: true
  payment_data: false
  notes: >-
    Never import unreviewed member agreements, payment records or broad
    shared drives into a demo. Verify model endpoints, retrieval permissions
    and deletion behavior before any confidential use.
risks:
  vendor_lock_in: >-
    Keep authoritative documents outside the retrieval database and ensure
    indexes can be rebuilt from approved source files.
  security: >-
    Validate user separation, document permissions, model endpoints,
    administrator recovery, retention and prompt-injection defenses.
  compliance: >-
    Staff and member privacy, content rights and approval remain the
    operator's responsibility.
  licensing: >-
    MIT software does not automatically license third-party models,
    knowledge sources or cloud inference.
  operational: >-
    A wrong answer about pricing, emergency procedures or building access
    requires an explicit handoff to authorized staff, not an AI guess.
