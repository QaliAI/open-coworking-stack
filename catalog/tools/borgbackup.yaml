task_fits:
  - task_id: perform-backup-restore-tests
    relationship: infrastructure
    automation_level: partially automated
    what_manual_process_it_can_replace: Re-copying unchanged service data for every backup and manually locating files in dated backup folders during a restore test.
    what_it_takes_off_the_team: Creates deduplicated encrypted archives and provides archive listing, checking, and extraction commands for a controlled restore drill.
    role_assisted: it-security-administrator
    what_remains_human: Prepare an application-consistent source, control keys and restored personal data, select the recovery point, and have the business owner verify restored usability and integrity.
    prerequisites:
      - An approved source manifest and application-consistency procedure
      - Independently recoverable repository credentials and encryption keys
      - An isolated restore target with owner-approved validation checks
    failure_consequence: A successful archive job can still produce unusable or incomplete recovery data; failed key custody or unsafe restoration can cause permanent loss or expose personal data.
    pilot_metric: One representative service restores on a clean isolated host within the measured objective and passes every owner-approved integrity check.
    evidence:
      - https://borgbackup.readthedocs.io/
    confidence: medium
