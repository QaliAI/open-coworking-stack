data_privacy:
  data_held:
    - media files and announcements
    - administrator accounts
    - display inventory and schedules
    - player connection logs
  personal_data: true
  payment_data: false
  notes: Collect only data needed for the pilot and confirm access, deletion and export behavior
    before operational adoption.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Separate signage players from sensitive member and office networks. Restrict CMS
    administration and uploaded content, apply CMS/player updates and avoid showing private booking
    or member data.
  compliance: Obtain permission before publishing member names, photographs or event attendee
    information on public screens.
  licensing: This record covers the AGPL CMS. Official open-source information covers Windows and
    Linux players. Android, LG webOS and Samsung Tizen players use separate commercial perpetual
    licenses; do not infer ChromeOS licensing or compatibility from the CMS license.
  operational: Test the exact hardware/player/CMS combination. Do not assume Linux, Windows, Android
    and TV-platform players have identical features or support; ChromeOS terms remain outside this
    review.
