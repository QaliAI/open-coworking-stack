schema_version: 1.0.0
id: xibo
name: Xibo CMS
tagline: Manage lobby announcements and event displays
description: Xibo CMS manages content shown by connected digital-signage players. A coworking team
  could schedule lobby welcome messages, event promotion and member announcements. The CMS license
  does not make every player free; player-platform terms and hardware support must be checked
  separately. Automatic room-booking synchronization is not verified here.
