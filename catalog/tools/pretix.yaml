tasks_reduced_or_augmented:
  - Collect workshop registrations and issue event tickets
  - Maintain order and attendee lists for event staff
human_oversight_still_needed:
  - Approve event capacity, taxes, refunds and organizer terms
  - Handle payment exceptions and check-in disputes with a manual fallback
task_fits: []
data_privacy:
  data_held:
    - attendee contact details
    - registration answers
    - orders and payment references
    - ticket and check-in records
  personal_data: true
  payment_data: true
  notes: Orders and payment references can be personal data. Actual card-data handling depends on
    provider and configuration and was not tested.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Protect organizer credentials, payment keys, attendee exports and scanner access. Follow
    stable-release upgrade guidance and test backup restoration before public sales.
  compliance: Staff retain responsibility for taxes, cancellation terms, accessibility and attendee
    privacy; ticketing software does not establish legal venue capacity.
  licensing: Most code uses AGPL v3 with additional terms including attribution and a conditional
    remote-network exception. Other components have different licenses. Read the full terms before
    modifying, white-labeling or offering services for third-party organizers.
  operational: Use a supported stable release rather than assuming the development branch is a
    production version. Verify plugins, scanner hardware, payment provider and required commercial
    modules separately.
