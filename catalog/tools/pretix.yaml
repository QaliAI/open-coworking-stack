schema_version: 1.0.0
id: pretix
name: pretix
tagline: Registration and ticket sales for coworking workshops and events
description: pretix provides event ticket shops and registration management. A coworking operator
  could sell workshop tickets and organize check-in for community or venue events, while staff own
  capacity, refunds and tax decisions. Self-hosted Community, commercial Enterprise and paid Hosted
  offerings have different support and feature conditions.
