task_fits:
  - task_id: maintain-operating-procedures
    relationship: system of record
    automation_level: assisted
    what_manual_process_it_can_replace:
      Scattered SOP files, printed binders, and instructions buried in chat history.
    what_it_takes_off_the_team:
      Centralizes approved procedure pages, ownership, links, and review status for easier retrieval.
    role_assisted: general-manager
    what_remains_human:
      Process owners must verify real-world steps and exceptions, approve changes, control sharing,
      and confirm staff can use normal and fallback paths.
    prerequisites:
      - Named procedure owners and a documented review cadence
      - Role-based permissions and a tested export fallback
    failure_consequence:
      Stale, conflicting, or over-shared guidance can cause unsafe or inconsistent service and expose
      sensitive operating information.
    pilot_metric:
      Percentage of pilot procedures with an accountable owner, current approval, and successful
      staff retrieval test.
    evidence:
      - https://www.notion.so/help
    confidence: medium
