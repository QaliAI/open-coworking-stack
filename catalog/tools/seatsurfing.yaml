task_fits:
  - task_id: manage-desk-assignments
    relationship: system of record
    automation_level: assisted
    what_manual_process_it_can_replace:
      Printed floor maps, whiteboard claims, and spreadsheet lists for ordinary hot-desk requests.
    what_it_takes_off_the_team:
      Presents configured desks and records member reservations against current availability.
    role_assisted: community-coordinator-front-desk
    what_remains_human:
      Staff must verify entitlement and actual desk readiness, handle accessibility needs, and fairly
      approve overrides or resolve competing constraints.
    prerequisites:
      - Accurate floor plan, desk attributes, and out-of-service status
      - Documented eligibility, accessibility, privacy, and override rules
    failure_consequence:
      An inaccurate map or unchecked assignment can double-book a desk, deny a usable accommodation,
      expose member presence, or leave a member without the workspace promised.
    pilot_metric:
      Percentage of pilot reservations matching entitlement and physically usable desk state, with
      conflicts and accessibility exceptions separately reviewed.
    evidence:
      - https://seatsurfing.io/docs/
    confidence: low
  - task_id: analyze-space-utilization
    relationship: reporting layer
    automation_level: assisted
    what_manual_process_it_can_replace:
      Manually compiling desk reservation counts from calendars, sign-in sheets, and spreadsheets.
    what_it_takes_off_the_team:
      Provides booking-based occupancy signals from the configured desk and space inventory.
    role_assisted: operations-facilities-manager
    what_remains_human:
      Operations staff must check booking data against observed use, aggregate it to protect privacy,
      explain local context, and approve any layout or capacity decision.
    prerequisites:
      - Consistent pilot booking use and current inventory status
      - Privacy-safe aggregation rules and an agreed physical spot-check method
    failure_consequence:
      Treating incomplete bookings as actual occupancy can drive poor capacity changes and turn a
      planning tool into disproportionate monitoring of individual members.
    pilot_metric:
      Difference between aggregated booking signals and approved physical spot checks, reported with
      missing-data and privacy limitations.
    evidence:
      - https://seatsurfing.io/docs/
    confidence: low
data_privacy:
  data_held:
