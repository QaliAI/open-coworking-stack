task_fits:
  - task_id: perform-backup-restore-tests
    relationship: infrastructure
    automation_level: partially automated
    what_manual_process_it_can_replace:
      Ad hoc file copies and backup checks that stop at a successful job message or downloaded file.
    what_it_takes_off_the_team:
      Creates encrypted snapshots and provides repository checking and restore commands for a
      repeatable recovery exercise.
    role_assisted: it-security-administrator
    what_remains_human:
      Administrators must protect keys, isolate restored data, define representative scenarios, and
      have business owners verify integrity and usability before accepting the result.
    prerequisites:
      - Documented backup scope, retention, recovery objectives, and offsite target
      - Separately protected credentials and a clean restore environment
    failure_consequence:
      Missing keys, corrupt or incomplete snapshots, or an unvalidated restore can leave critical
      coworking records unrecoverable during an incident while successful-job signals create false
      confidence.
    pilot_metric:
      Percentage of representative restore checks completed successfully within the approved recovery
      objective, with every failed dependency assigned for remediation.
    evidence:
      - https://restic.readthedocs.io/
      - https://github.com/restic/restic
    confidence: medium
