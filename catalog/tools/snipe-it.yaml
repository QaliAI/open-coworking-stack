data_privacy:
  data_held:
    - asset identifiers and serial numbers
    - purchase and warranty records
    - assigned users
    - checkout and return history
  personal_data: true
  payment_data: false
  notes: Collect only data needed for the pilot and confirm access, deletion and export behavior
    before operational adoption.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security:
    Restrict administrative access and asset exports, apply updates and secure attachments and
    backups. Avoid storing door codes or unnecessary personal documents in asset notes.
  compliance: Set retention and access rules for staff or member assignment history and purchase documents.
  licensing: Official repository identifies AGPL-3.0. Paid hosting and support do not turn the
    self-hosted software into a free hosted service.
  operational: An assignment record is not proof that an item was physically returned. Define who
    reconciles inventory; asset maintenance records do not replace a full maintenance dispatch
    process.
