id: snipe-it
name: Snipe-IT
tagline: Track shared equipment and who has checked it out
description: Snipe-IT records assets and their assignment history. A coworking operator could track
  loan laptops, monitors, AV kits and key inventory, with staff reconciling physical handovers. It
  is an asset register rather than a complete facilities maintenance system, room-reservation system
  or physical access controller.
