  - Realm and client configuration reviews
  - MFA policy decisions
  - Break-glass admin procedures
task_fits:
  - task_id: provision-member-access
    relationship: integration layer
    automation_level: partially automated
    what_manual_process_it_can_replace: Manual process reduced is creating a separate identity and
      copying the same approved application roles in each connected account store.
    what_it_takes_off_the_team: Human work reduced is repeated identity creation, credential handling,
      and standard role assignment within the tested Keycloak scope.
    role_assisted: it-security-administrator
    what_remains_human: Humans must verify identity and authorization, approve least privilege, review
      nonstandard roles, and confirm downstream results. Prohibited entitlement, privileged-access,
      identity-evidence, and exception decisions can never be fully automated.
    prerequisites:
      - Prerequisite is an approved identity source, entitlement owner, realm and role model, MFA
        policy, time bounds, audit retention, and break-glass procedure.
      - Prerequisite is separate staging verification for every in-scope application and protocol;
        compatibility is not assumed.
    failure_consequence: Failure can grant excessive access or leave a member unable to sign in;
      disable the affected flow, use the tested fallback, and reconcile downstream access manually.
    pilot_metric: Metric is approved test identities receiving exactly the intended roles and dates,
      with failed, excessive, or missing downstream access counted separately.
    evidence:
      - https://www.keycloak.org/documentation
    confidence: medium
  - task_id: revoke-departing-access
    relationship: integration layer
    automation_level: partially automated
    what_manual_process_it_can_replace: Manual process reduced is searching Keycloak-managed identities,
      roles, and sessions separately before applying an approved revocation.
    what_it_takes_off_the_team: Human work reduced is repeated account disabling, session termination,
      and standard role removal inside the verified Keycloak boundary.
    role_assisted: it-security-administrator
    what_remains_human: Humans must authorize scope and timing, protect continuity and evidence,
      investigate unmatched identities, and confirm every downstream result. Prohibited emergency,
      disputed-departure, shared-access, and residual-risk decisions can never be fully automated.
    prerequisites:
      - Prerequisite is an authoritative approved offboarding event with exact identity, scope,
        effective time, evidence owner, and rollback or continuity instructions.
      - Prerequisite is a tested account and session inventory for each in-scope application;
        downstream revocation compatibility is not assumed.
    failure_consequence: Failure can preserve unauthorized access or revoke the wrong person early;
      invoke the approved incident path and manually inspect residual and shared access.
    pilot_metric: Metric is known test access removed at the authorized time, residual sessions and
      roles found by human review, failed targets, and time to complete reconciliation.
    evidence:
      - https://www.keycloak.org/documentation
    confidence: medium
  - task_id: review-privileged-access
    relationship: reporting layer
    automation_level: assisted
    what_manual_process_it_can_replace: Manual process reduced is assembling realm administrators,
      client roles, groups, and privileged assignments from separate screenshots for review.
    what_it_takes_off_the_team: Human work reduced is locating Keycloak-held role and identity records
      and preparing a consistent in-scope access inventory.
    role_assisted: it-security-administrator
    what_remains_human: An independent human must attest business need, examine hidden credentials and
      access outside Keycloak, approve retained privilege, and verify remediation. Prohibited need,
      risk-acceptance, compensating-control, and removal decisions can never be fully automated.
    prerequisites:
      - Prerequisite is a documented realm, client, role, group, service-account, supplier, and
        break-glass inventory with named owners.
      - Prerequisite is an independent review process that also covers privileges and credentials not
        represented in Keycloak.
    failure_consequence: Failure can omit external or inherited privilege and create false assurance;
      keep findings open until an independent reviewer reconciles all authoritative systems.
    pilot_metric: Metric is in-scope privileged assignments with current owner and approved need,
      orphaned or excessive access found, remediation age, and sampled inventory omissions.
    evidence:
      - https://www.keycloak.org/documentation
    confidence: medium
