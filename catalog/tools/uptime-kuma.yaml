task_fits:
  - task_id: triage-network-connectivity
    relationship: infrastructure
    automation_level: assisted
    what_manual_process_it_can_replace:
      Repeated manual checks of configured HTTP endpoints, ports, and certificates after a report.
    what_it_takes_off_the_team:
      Supplies check results, alert timing, and heartbeat history for monitored services.
    role_assisted: it-security-administrator
    what_remains_human:
      Validate each alert, establish affected users and locations, distinguish network from
      application or upstream causes, communicate status, and approve changes.
    prerequisites:
      - Approved monitors and thresholds for representative member-facing services
      - A tested notification route with named response ownership
      - Monitoring placed so its own failure and blind spots are understood
    failure_consequence:
      A missed or false alert can delay response or cause unnecessary intervention, while a healthy
      endpoint can conceal a user-specific connectivity problem.
    pilot_metric:
      For pilot alerts, record time to human acknowledgement and whether investigation confirms the
      reported service and scope.
    evidence:
      - https://uptime.kuma.pet/
      - https://github.com/louislam/uptime-kuma/wiki
    confidence: low
