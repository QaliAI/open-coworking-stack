task_fits:
  - task_id: analyze-campaign-performance
    relationship: reporting layer
    automation_level: assisted
    what_manual_process_it_can_replace: Manually copying basic website pageview and event counts into an ad hoc campaign report.
    what_it_takes_off_the_team: Collects and presents website traffic and configured event evidence for campaign review.
    role_assisted: marketing-manager
    what_remains_human:
      Validate tracking and consent, reconcile web evidence with spend and qualified outcomes,
      explain attribution limits, and approve any campaign change.
    prerequisites:
      - An approved measurement and consent plan
      - Tested campaign parameters and events on the relevant pages
      - Restricted analytics access and an agreed retention policy
    failure_consequence:
      Missing, duplicated, or misconfigured events can produce a confident but false campaign
      conclusion.
    pilot_metric:
      Each pilot campaign review uses validated web metrics and records attribution and data-quality
      caveats before a decision.
    evidence:
      - https://umami.is/
      - https://umami.is/docs
    confidence: medium
