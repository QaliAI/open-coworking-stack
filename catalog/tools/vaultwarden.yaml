name: Vaultwarden
tagline: Lightweight Bitwarden-compatible password server for staff secrets
description: Vaultwarden is an unofficial Bitwarden-compatible server written in Rust. Operators use
  it to host a shared password vault for staff credentials (Wi-Fi admin, vendor portals, door
  software) without individual consumer password-manager sprawl.
