risks:
  vendor_lock_in: Evaluate export formats and API completeness before deep customization.
  security:
    Use 7.1.0 or later. Versions before 7.1.0 permit unauthenticated account takeover through
    a forged persistent-login cookie, including administrator accounts (GHSA-mvjx-72w3-wqhp).
    Hiding Remember Me is not a fix. Review upstream incident guidance if an older instance was exposed.
  compliance: Operator remains responsible for privacy and local regulatory obligations.
  licensing: Verify LICENSE in the active repository fork you deploy.
  operational: Plan backups, monitoring, and a restore drill before production use.
