task_fits:
  - task_id: publish-campaign-assets
    relationship: partial automation
    automation_level: assisted
    what_manual_process_it_can_replace: Editing server files directly to publish approved campaign content on the marketing website.
    what_it_takes_off_the_team:
      Provides an administrative editor and publishing workflow for the website portion of a
      campaign.
    role_assisted: marketing-manager
    what_remains_human:
      Confirm the approved version, claims, links, audience, consent, accessibility, and offer state;
      preview the page; authorize publication; and decide whether to pause or roll back.
    prerequisites:
      - Approved final content, claims, assets, and publication timing
      - Least-privilege publishing roles and a protected administrator account
      - Maintained themes and plugins plus a tested backup, staging, and rollback path
    failure_consequence:
      The wrong or unsafe content can become public, and a vulnerable publishing stack can expose
      the site or submitted personal data.
    pilot_metric:
      Pilot web assets match the approved version after human preview, and one correction or rollback
      path is demonstrated before campaign use.
    evidence:
      - https://wordpress.org/
      - https://wordpress.org/documentation/
    confidence: medium
