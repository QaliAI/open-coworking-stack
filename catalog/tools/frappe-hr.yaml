  - Review local payroll obligations, employment rules and sensitive-data access
task_fits: []
data_privacy:
  data_held:
    - employee records and contacts
    - leave and attendance
    - shift assignments
    - salary or payroll records if enabled
    - location data if explicitly enabled
  personal_data: true
  payment_data: false
  notes: Collect only data needed for the pilot and confirm access, deletion and export behavior
    before operational adoption.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Separate HR administration from ordinary member accounts. Restrict salary and personnel
    records, protect backups and configure location or biometric processing only after an approved
    need and privacy review.
  compliance: A qualified local owner must validate employment and payroll rules. India Payroll is
    documented as a separate extension, not evidence of universal localization.
  licensing: Official HRMS repository carries GPL version 3. Frappe Cloud hosting and professional
    implementation are separate services; verify licenses and compatibility for any regional
    extension.
  operational: Frappe installation and upgrades need technical ownership and compatible application
    versions. Shift features are documented, but jurisdiction-compliant payroll, bank filing and tax
    reporting are not established by this review.
