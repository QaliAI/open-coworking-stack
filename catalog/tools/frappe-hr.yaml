id: frappe-hr
name: Frappe HR
tagline: Staff records, leave and attendance for growing operators
description: Frappe HR manages employee records, onboarding, leave, shifts and attendance. A growing
  coworking operator could use it to organize community and operations staff across locations.
  Payroll exists but country-specific rules, extensions and reporting must be reviewed by a
  qualified local payroll owner before use.
