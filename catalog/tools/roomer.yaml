risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Readiness is unverified. Keep the first pilot isolated with synthetic data; review
    authentication, generated credentials, upload handling, network access and database backups
    before exposing it.
  compliance:
    Floor plans and occupancy data can be sensitive; obtain permission and define access and
    retention before using real locations or member records.
  licensing: The exact project from prior research is c0dewhacker/Roomer, which identifies AGPL-3.0.
    Do not confuse it with similarly named room, hotel or property products.
  operational: Repository features are not evidence of safe production operation. Release/support
    policy, security response, migration recovery, accessibility and operator adoption remain
    unresolved; no memberships, billing or access-control capability is asserted.
