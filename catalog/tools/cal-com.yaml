name: Cal.com
tagline: Hosted scheduling for prospect tours and sales consultations
description: Cal.com lets prospects choose a tour or consultation time from configured host
  availability. This record covers the hosted service; its free individual plan and paid team
  features differ. It is not a membership, room-inventory, recurring-billing or access-control system.
