task_fits:
  - task_id: schedule-prospect-tours
    relationship: partial automation
    automation_level: partially automated
    what_manual_process_it_can_replace: Negotiating ordinary tour times by email and separately copying confirmed appointments into a host calendar.
    what_it_takes_off_the_team: Presents configured host availability, collects approved preparation fields, and records standard bookings without repeated scheduling messages.
    role_assisted: sales-leasing-manager
    what_remains_human: Approve offered sites and hours, choose the right host, review accessibility or unusual access needs, and handle conflicts, cancellations, and exceptions.
    prerequisites:
      - An approved tour event type, host calendar, duration, and availability window
      - Minimum-data intake fields and reviewed visitor instructions
      - A visible human route for accessibility, security, and scheduling exceptions
    failure_consequence: Incorrect availability or missed access needs can create a double booking, failed arrival, privacy exposure, or an unsuitable tour that staff must recover manually.
    pilot_metric: Five real pilot tours occur as confirmed with no unexplained calendar conflict and every accommodation or arrival requirement reaches the named host.
    evidence:
      - https://cal.com/docs
    confidence: medium
