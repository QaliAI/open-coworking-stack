data_privacy:
  data_held:
    - booking and attendee details
    - calendar access tokens
    - host availability
    - notification configuration
  personal_data: true
  payment_data: false
  notes: Collect only data needed for the pilot and confirm access, deletion and export behavior
    before operational adoption.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Upstream does not guarantee the community edition security or safety. Do not connect
    production credentials or real prospect records for the first research pilot.
  compliance: Even test calendar access can reveal personal data; use synthetic data and test
    credentials. Commercial use suitability requires an explicit edition and support decision.
  licensing:
    MIT applies to the community repository, not the commercial Cal.com hosted application or
    enterprise offering. The old calcom/cal.com repository URL redirects here. Official
    documentation recommends personal, non-production use.
  operational: Official documentation strictly recommends personal, non-production use. Team events,
    round-robin and collective team scheduling are absent from its published edition comparison. No
    production recommendation or operational test is claimed.
