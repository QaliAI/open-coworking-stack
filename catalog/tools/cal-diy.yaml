id: cal-diy
name: Cal.diy
tagline: Research-only community scheduling edition with a non-production warning
description: Cal.diy is the MIT-licensed self-hosted community edition associated with Cal.com. Its
  documentation describes individual appointment scheduling, but explicitly recommends personal,
  non-production use and advanced administration. Coworking tour scheduling is a possible research
  use only; it is not recommended here for a live operator booking system.
