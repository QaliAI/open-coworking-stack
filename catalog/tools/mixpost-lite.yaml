  notes: Collect only data needed for the pilot and confirm access, deletion and export behavior
    before operational adoption.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Protect OAuth secrets and media, restrict administration, monitor queues and install
    security updates. Use a public domain with TLS for provider communication.
  compliance: Check image rights, member consent, advertising claims and provider terms before posting.
  licensing: This record covers the MIT-licensed Lite repository only. Pro and Enterprise are
    commercial products with separate terms; their network connectors and features are not licensed
    by the Lite MIT grant.
  operational: Lite supports a narrower network set than paid editions. Staff approval must happen
    outside Lite unless a separately licensed edition provides the required approval flow.
