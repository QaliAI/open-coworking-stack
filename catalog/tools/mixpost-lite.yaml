id: mixpost-lite
name: Mixpost Lite
tagline: Self-hosted scheduling for a limited set of social networks
description: Mixpost Lite provides a calendar and publishing tools for Facebook Pages, Mastodon
  profiles and X profiles. Coworking staff could schedule approved event and office-availability
  posts on those channels. Other networks, approval flows, the posting queue and advanced analytics
  belong to paid editions and must not be assumed available in Lite.
