  spdx: MIT
  source_url: https://github.com/every-app/open-seo/blob/main/LICENSE
  notes: >-
    The linked project license is MIT. Check current repository and hosting
    terms before forking, branding or embedding the software.
  verified_on: 2026-11-11
cost:
  model: usage-based
  summary: >-
    Self-hosted software is MIT licensed, but most SEO research workflows
    require a separately billed DataForSEO API key. Hosting, AI models and
    any managed service add costs. Pay-as-you-go is not free SEO data.
  currency_caveat: Verify current API prices, quotas, charges and hosted plans.
  pricing_url: https://openseo.so/pricing
  confidence: partially-verified
implementation:
  difficulty: moderate
  maintenance_burden: medium
  skills_required:
    - api-budget-management
    - local-seo-knowledge
    - container-or-cloud-administration
  smallest_useful_experiment: >-
    Use fictional locations and an explicitly capped API budget to research
    five local service keywords, review one site audit, and check the
    source and cost of each returned metric before any ranking decision.
