tasks_reduced_or_augmented:
  - Explore local service keywords and site health in one interface
  - Help prepare a factual SEO improvement worklist for each location
human_oversight_still_needed:
  - Assess actual local intent, service availability and listing eligibility
  - Verify provider data, budget, website changes and attribution to leads
data_privacy:
  data_held:
    - website and keyword research records
    - api tokens
    - agent activity where configured
  personal_data: false
  payment_data: false
  notes: >-
    Search terms and project domains can still be commercially sensitive.
    Keep API keys private and review model-provider and usage logging settings.
risks:
  vendor_lock_in: >-
    Research data depends on external providers; document exports and costs.
  security: >-
    Protect DataForSEO and model API keys, secure any public-facing dashboard,
    and set explicit spending limits before enabling agent-driven calls.
  compliance: >-
    Verify current search-provider terms and Google rules before advising
    operators on profile eligibility or automated ranking checks.
  licensing: MIT source code does not include a free SEO data license.
  operational: >-
    API consumption costs may increase with automation; audit usage and
    never promise ranking improvements from a tool installation.
