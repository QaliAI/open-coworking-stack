schema_version: 1.0.0
id: open-seo
name: OpenSEO
tagline: Self-hostable SEO research and AI-agent workflow tool
description: >-
  OpenSEO is a self-hostable SEO research interface for keyword research, rank
  tracking, backlink insights, site audits and AI visibility. It can help
  coworking operators investigate local search terms for offices, meeting
  rooms, day passes and virtual offices. It is not a free backlink dataset
  or a proven one-for-one replacement for Ahrefs or Semrush.
