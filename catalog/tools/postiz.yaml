  notes: Collect only data needed for the pilot and confirm access, deletion and export behavior
    before operational adoption.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security: Protect provider tokens, OAuth secrets and team access. Restrict automation permissions
    and revoke access when staff or agencies leave.
  compliance: Obtain permission for member images and testimonials. Staff own copyright, advertising
    claims, marketing consent and retention.
  licensing: The public self-hosted repository identifies AGPL-3.0. Hosted plan access and new
    hosted-first agent features are separate from the availability of community source code.
  operational: Social-network app approval may take weeks, and API policy changes can interrupt
    publishing. Hosted agent features ship first; verify feature parity instead of assuming it.
