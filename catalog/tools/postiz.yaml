name: Postiz
tagline: Schedule approved social posts for coworking marketing
description: Postiz schedules and publishes social content from a shared calendar. A coworking
  marketing team could prepare posts about tours, member events and available offices, then review
  them before publication. Self-hosting requires each social network provider to be configured;
  hosted and self-hosted features may differ.
