human_oversight_still_needed:
  - Approve event capacity, pricing, accessibility information and refunds
  - Resolve payment failures, attendee disputes and door exceptions
task_fits: []
data_privacy:
  data_held:
    - attendee names and email addresses
    - registration answers
    - ticket orders and payment references
    - check-in records
  personal_data: true
  payment_data: true
  notes: Orders and payment references can be personal data. Actual card-data handling depends on
    provider and configuration and was not tested.
risks:
  vendor_lock_in: Export, migration and restore behavior have not been tested; retain a practical
    manual fallback before depending on the tool.
  security:
    Protect organizer accounts, payment credentials, attendee exports and check-in links. Keep
    the application updated and test a restore before public ticket sales.
  compliance:
    Staff remain responsible for event taxes, refund terms, marketing consent, accessibility
    and attendee-data retention.
  licensing: Community code requires visible Powered by Hi.Events attribution on generated pages and
    emails. Files under backend/ee and frontend/src/ee have an Enterprise Licence. Do not treat
    reserved seating, box office or company SSO as free community features.
  operational: Check the exact free versus enterprise feature boundary. Retain a staff-readable
    attendee list and a payment/refund exception process; software check-in does not determine
    physical venue safety.
