  source_url: https://github.com/HiEventsDev/hi.events/blob/develop/LICENCE
  notes: Community code requires visible Powered by Hi.Events attribution on generated pages and
    emails. Files under backend/ee and frontend/src/ee have an Enterprise Licence. Do not treat
    reserved seating, box office or company SSO as free community features.
  verified_on: 2026-10-23
cost:
  model: open-core-paid-features
  summary: Community self-hosting has no platform fee but needs hosting, email, administration and
    payment processing. Hosted ticket fees and payment processor fees apply. Paid enterprise
    licensing or add-ons cover restricted features and attribution removal.
  pricing_url: https://hi.events/pricing
  currency_caveat: Plans, provider terms and prices change; check official sources before making a
