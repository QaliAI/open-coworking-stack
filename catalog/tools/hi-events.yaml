schema_version: 1.0.0
id: hi-events
name: Hi.Events
tagline: Tickets, registration and check-in for coworking events
description: Hi.Events lets organizers sell tickets, collect registrations and check attendees in. A
  coworking team could use it for a paid workshop or networking event while staff control capacity,
  refunds and arrival exceptions. Reserved seating, box office and company single sign-on require
  paid enterprise features.
