schema_version: 1.0.0
id: solo-operator-hosted-simple
name: Solo Operator Hosted and Simple
tagline: Favor managed services and one clear record for each daily workflow
description: A low-maintenance hosted baseline for one operator who needs memberships, payments, communication, scheduling, and simple content without running production servers.
audience_roles: [owner-operator, community-manager, finance]
problems_solved: [reduce-manual-admin, automate-billing, improve-member-experience, grow-pipeline]
workflows: [member-onboarding, tour-to-close, invoice-collections, room-booking]
monthly_cash_budget_band: flexible
self_host_heavy: false
operator_profile: A solo owner-host who values simplicity and support over infrastructure control.
number_of_locations: One location.
team_size: One primary operator with one documented emergency delegate.
products_offered: [memberships, day passes, meeting rooms]
technical_skill_required: Low; vendor administration, exports, account security, and basic website editing.
tasks_covered:
  [
    membership-administration,
    payment-collection,
    tour-scheduling,
    staff-email,
    simple-marketing-content,
    member-communication,
  ]
tasks_not_covered:
  [
    statutory-accounting,
    tax-filing,
    physical-access-response,
    staffed-cover,
    legal-review,
    vendor-outage-resolution,
  ]
systems_of_record:
  - Cobot is the member, product, booking, and billing workflow record.
  - Stripe is the payment transaction record.
  - Google Workspace is the staff communication and working-document record.
components:
  - tool_id: cobot
    role_in_stack: Hosted coworking operations authority
    required: true
  - tool_id: stripe
    role_in_stack: Hosted payment processing authority
    required: true
  - tool_id: google-workspace
    role_in_stack: Staff email, calendar, and working documents
    required: true
  - tool_id: cal-com
    role_in_stack: Optional public tour scheduling
    required: false
  - tool_id: canva
    role_in_stack: Optional marketing asset production
    required: false
data_flow:
  - The operator enters membership facts once in Cobot and directs payments to Stripe.
  - Tour requests enter the operator calendar; accepted prospects are created in Cobot by a human.
  - Financial summaries flow to the external accountant without sharing unnecessary member data.
implementation_order:
  [
    choose-membership-authority,
    configure-products,
    connect-payments,
    secure-staff-account,
    test-onboarding,
    test-refund,
    publish-tour-route,
    document-outage-process,
  ]
cost_assumptions:
  monthly_cash: Edit using current official quotes for the chosen plans, payment volume, domain, and optional scheduling or design tools.
  setup_labor: A few structured configuration and testing sessions plus accountant and staff review.
  maintenance_labor: Reserve weekly reconciliation and support time and monthly export and access checks.
  messaging_email_sms: Start with included email capabilities; treat SMS and campaign delivery as explicit usage costs.
  hosting_storage: Managed vendors host core systems; verify storage, retention, export, and support terms.
  notes:
    - Simplicity is more important than maximizing free tiers.
    - A relief operator still needs documented access and procedures.
  pricing_sources: []
human_owners:
  [
    owner-operator for operations and vendors,
    external-accountant for statutory records,
    emergency-delegate for continuity,
  ]
security_boundaries:
  - Keep card data with Stripe and grant the accountant minimum necessary access.
  - Use multifactor authentication and separate owner and delegate accounts.
  - Require human approval for refunds, access exceptions, and account closure.
backup_and_recovery:
  - Export member, booking, and financial reports monthly to protected storage.
  - Maintain an offline current-day arrivals and contact procedure.
  - Test delegate access and one data export quarterly.
assumptions:
  - Managed subscriptions are acceptable in exchange for lower maintenance.
  - Internet connectivity and responsive vendor support are available.
risks:
  - The owner is a people and process single point of failure.
  - SaaS outages or account suspension can interrupt most workflows.
getting_started:
  [
    list-products-and-policies,
    configure-test-account,
    process-test-payment,
    export-test-data,
    document-delegate-access,
  ]
pilot_plan:
  - Onboard one test member and process payment, booking, cancellation, and refund.
  - Have the emergency delegate follow the outage runbook without owner assistance.
rollout_30_day:
  - Migrate active members in small reconciled batches.
  - Publish support hours, booking rules, and escalation contacts.
maturity_90_day:
  - Review subscriptions, exports, permissions, support burden, and member friction.
  - Remove duplicate spreadsheets and unused optional tools.
exit_strategy:
  - Export member, booking, invoice, payment, and document records before cancellation.
  - Notify members, rotate credentials, and retain only legally required records.
commercial_fallback:
  - Consolidate optional scheduling and communication into the coworking SaaS when tool switching becomes burdensome.
  - Engage a managed implementation partner if owner capacity blocks safe operation.
verification:
  last_reviewed: 2026-07-18
  notes: Confirm vendor plans, export formats, and support coverage before purchase.
