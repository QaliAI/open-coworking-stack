schema_version: 1.0.0
id: space-room-desk-operations
name: Space Room and Desk Operations
tagline: Keep resource availability, site signals, and staff response clearly owned
description: An operations stack for desk and room reservations, network visibility, basic site automation, and service monitoring with manual safety and facilities response retained.
audience_roles: [operations-manager, facilities, community-manager, technical-operator]
problems_solved:
  [fill-meeting-rooms, measure-utilization, improve-wifi-reliability, reduce-manual-admin]
workflows: [room-booking, desk-hot-desk, facility-maintenance, incident-response]
monthly_cash_budget_band: under-200
self_host_heavy: true
operator_profile: A space operator that needs one booking authority and can support local network and facilities tooling.
number_of_locations: One to three locations, each with explicit resource and network ownership.
team_size: Three to twenty staff across hosts, facilities, and technical support.
products_offered: [hot desks, dedicated desks, meeting rooms, private offices]
technical_skill_required: Moderate to high; resource administration, networking, IoT isolation, monitoring, and backups.
tasks_covered:
  [
    desk-booking,
    room-booking,
    availability-publishing,
    network-observability,
    basic-site-automation,
    outage-alerting,
  ]
tasks_not_covered:
  [
    life-safety-control,
    emergency-response,
    building-code-compliance,
    maintenance-repair,
    cleaning,
    access-authorization-judgment,
  ]
systems_of_record:
  - Seatsurfing is the desk reservation record.
  - LibreBooking is the room reservation record.
  - The approved facilities log outside this stack remains the maintenance work record.
components:
  - tool_id: seatsurfing
    role_in_stack: Desk inventory and reservation authority
    required: true
  - tool_id: librebooking
    role_in_stack: Room inventory and reservation authority
    required: true
  - tool_id: unifi-network
    role_in_stack: Network operations and visibility
    required: true
  - tool_id: home-assistant
    role_in_stack: Optional non-safety site automation
    required: false
  - tool_id: uptime-kuma
    role_in_stack: Service and endpoint alerts
    required: true
data_flow:
  - Staff publish desks and rooms in their designated booking authorities and resolve exceptions manually.
  - Network and service telemetry alerts technical owners without becoming a member activity record.
  - Home Assistant may consume non-sensitive site signals but must not control life-safety systems.
implementation_order:
  [
    inventory-resources,
    choose-booking-authorities,
    define-policies,
    pilot-one-room-and-desk-zone,
    baseline-network,
    add-monitoring,
    isolate-iot,
    pilot-non-safety-automation,
  ]
cost_assumptions:
  monthly_cash: Edit for booking hosting or plans, network support, monitoring delivery, backups, and replacement hardware reserves.
  setup_labor: Include resource cleanup, floor validation, network mapping, policy design, signage, and staff testing.
  maintenance_labor: Reserve daily exception checks and recurring firmware, account, inventory, and alert review.
  messaging_email_sms: Booking reminders and outage alerts may have delivery charges; SMS needs a separate approved budget.
  hosting_storage: Plan separate backups for booking databases and network configuration; telemetry retention should be limited.
  notes:
    - Hardware purchase and cabling are outside the monthly software planning band.
    - Automation must fail safely and preserve manual control.
  pricing_sources: []
human_owners:
  [
    operations-manager for inventory and policy,
    community-manager for exceptions,
    facilities for site response,
    technical-operator for network and hosting,
  ]
security_boundaries:
  - Separate member, staff, administrative, and IoT networks.
  - Limit location and usage telemetry to operational necessity.
  - Keep life-safety, locks, and emergency decisions outside experimental automation.
backup_and_recovery:
  - Back up booking data, resource configuration, and network controller configuration.
  - Print current-day reservations and maintain manual room signage for outages.
  - Test controller and booking restore procedures quarterly.
assumptions:
  - Staff can enforce one reservation authority per resource type.
  - Facilities and technical owners can respond to alerts during stated hours.
risks:
  - Split calendars can cause double booking and member conflict.
  - Poorly isolated IoT or network administration can expand security impact.
getting_started:
  [
    audit-inventory,
    label-resources,
    pilot-small-zone,
    publish-booking-rules,
    baseline-alerts,
    document-manual-mode,
  ]
pilot_plan:
  - Run one room and one desk zone for two weeks.
  - Test no-show, conflict, network outage, and manual check-in procedures.
rollout_30_day:
  - Add resource groups only after inventory and signage match the system.
  - Establish facilities and technical escalation rotations.
maturity_90_day:
  - Review utilization, conflicts, alerts, firmware, permissions, and manual overrides.
  - Remove unused telemetry and unsafe automation dependencies.
exit_strategy:
  - Export reservations and resource inventories and retain neutral floor and network documentation.
  - Restore manual booking before retiring a live booking service.
commercial_fallback:
  - Consolidate bookings into the core coworking SaaS if dual systems remain confusing.
  - Use managed network support when in-house response coverage is inadequate.
verification:
  last_reviewed: 2026-07-18
  notes: Life-safety and physical maintenance remain human and specialist responsibilities.
