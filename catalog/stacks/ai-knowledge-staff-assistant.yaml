schema_version: 1.0.0
id: ai-knowledge-staff-assistant
name: AI Knowledge and Staff Assistant
tagline: Ground assisted drafts in approved SOPs and keep staff responsible for every action
description: A governance-first pattern for preparing staff assistance from controlled knowledge, reviewed automation, support conversations, and protected secrets without treating an AI model as a system of record.
audience_roles: [operations-manager, community-manager, technical-operator, owner-operator]
problems_solved: [centralize-knowledge, reduce-manual-admin, integrate-stack, privacy-compliance]
workflows: [member-onboarding, incident-response, compliance-review, vendor-offboarding]
monthly_cash_budget_band: flexible
self_host_heavy: true
operator_profile: An operator with stable written procedures that wants supervised drafting and retrieval before considering higher-risk automation.
number_of_locations: One to many locations sharing approved core procedures with local exceptions.
team_size: Five or more staff with knowledge, privacy, security, and workflow owners.
products_offered: [staff-sop-search, assisted-response-drafts, onboarding-checklists, internal-incident-guidance]
technical_skill_required: High; knowledge governance, integrations, secrets, evaluation, privacy, logging, and incident response.
tasks_covered: [sop-search, response-drafting, checklist-suggestion, knowledge-gap-reporting, approved-workflow-routing, staff-feedback-capture]
tasks_not_covered: [autonomous-member-messaging, legal-advice, safety-decisions, refunds, door-access-decisions, employee-discipline, final-policy-approval]
systems_of_record:
  - BookStack is the approved procedure and policy record.
  - Chatwoot remains the support conversation record.
  - Any separately approved model is a processor and never a system of record.
components:
  - tool_id: bookstack
    role_in_stack: Curated source knowledge and approval history
    required: true
  - tool_id: n8n
    role_in_stack: Reviewed workflow orchestration and approval gates
    required: true
    notes: No model is selected by this catalog record; approve one separately before connection.
  - tool_id: chatwoot
    role_in_stack: Staff workspace for reviewing assisted response drafts
    required: true
  - tool_id: formbricks
    role_in_stack: Structured staff quality and harm feedback
    required: false
  - tool_id: openbao
    role_in_stack: Integration secret management
    required: true
data_flow:
  - Approved BookStack pages are selected for retrieval through a separately reviewed indexing and model service.
  - n8n sends minimum necessary context and returns a draft to staff in Chatwoot without automatic delivery.
  - Staff approve, edit, reject, and report outputs; decisions and source corrections return to human-owned records.
implementation_order: [inventory-and-approve-knowledge, classify-prohibited-data, select-separate-model-processor, document-data-terms, configure-secrets, build-read-only-prototype, create-evaluation-set, pilot-drafts, add-approval-gates]
cost_assumptions:
  monthly_cash: Edit for knowledge hosting, orchestration, secrets, backups, and separately approved model or inference usage.
  setup_labor: Expect significant curation, privacy and security review, integration work, evaluation design, and staff training.
  maintenance_labor: Reserve weekly quality and incident review plus recurring source, access, model, and prompt evaluation.
  messaging_email_sms: The assistant does not send messages automatically; ordinary support delivery charges remain with the channel.
  hosting_storage: Source documents, indexes, logs, and backups need separate retention and access decisions.
  notes:
    - No AI model tool currently forms part of this catalog stack; selection is an explicit procurement boundary.
    - Staff time for review and source maintenance is a core cost.
  pricing_sources: []
human_owners: [knowledge-owner for sources, operations-manager for workflow, privacy-owner for data use, technical-operator for integration, frontline-staff for final responses]
security_boundaries:
  - Exclude payment card data, credentials, identity documents, health data, and unrestricted private conversations from prompts.
  - Keep model credentials in OpenBao and restrict retrieval to approved sources.
  - Require a human before external communication or any consequential action.
backup_and_recovery:
  - Back up approved knowledge, workflow definitions, evaluation sets, and configuration.
  - Preserve a no-AI manual support path and disable integrations with one documented action.
  - Test restore and kill-switch procedures quarterly.
assumptions:
  - Approved SOPs are accurate, current, and assigned to human owners.
  - A model processor will be separately assessed for data handling and terms.
risks:
  - Plausible but wrong drafts can cause harm if staff over-trust them.
  - Retrieval, logs, or model providers can expose confidential information.
getting_started: [curate-ten-sops, define-prohibited-uses, build-twenty-case-evaluation, prototype-read-only, pilot-with-expert-staff]
pilot_plan:
  - Use a fixed evaluation set and a small expert cohort for internal drafts only.
  - Record source coverage, edits, unsafe outputs, time saved or added, and staff confidence.
rollout_30_day:
  - Permit only passed use cases and publish escalation and kill-switch procedures.
  - Review every external draft before sending and audit a sample weekly.
maturity_90_day:
  - Re-evaluate after source, workflow, model, or policy changes.
  - Remove use cases that lack quality evidence or accountable owners.
exit_strategy:
  - Export knowledge, workflows, evaluations, prompts, and approved configuration without model-generated material becoming policy.
  - Revoke model and integration credentials, delete provider data where supported, and return staff to manual workflows.
commercial_fallback:
  - Use a contractually reviewed managed assistant if self-host integration cannot meet security or reliability needs.
  - Keep ordinary search and human-authored templates if no assistant passes evaluation.
verification:
  last_reviewed: 2026-07-18
  notes: This stack intentionally requires separate model selection and human approval for all consequential output.
