schema_version: 1.0.0
id: bootstrap-near-zero
name: Near-Zero Cash Technical Self-Host
tagline: Trade skilled operator time for a minimal self-hosted control plane
description: A near-zero software-license architecture for a technical independent operator who can maintain a small server, document manual controls, and keep payments outside the stack.
audience_roles: [owner-operator, technical-operator, operations-manager]
problems_solved: [reduce-software-cost, self-host-for-data-control, replace-spreadsheets, disaster-recovery]
workflows: [member-onboarding, tour-to-close, backup-restore-drill, incident-response]
monthly_cash_budget_band: near-zero
self_host_heavy: true
operator_profile: A cash-constrained independent operator with reliable Linux and container skills who accepts manual work during the pilot.
number_of_locations: One location, with no shared production dependency across sites.
team_size: One to three staff, including a named technical owner.
products_offered: [coworking memberships, day passes, meeting rooms]
technical_skill_required: High; Linux, DNS, TLS, containers, patching, logs, and restore testing are required.
tasks_covered: [tour-lead-tracking, staff-password-management, sop-publishing, service-monitoring, encrypted-backup, shared-support-inbox]
tasks_not_covered: [card-payment-processing, door-access-control, statutory-accounting, tax-filing, staffed-front-desk, legal-compliance-review]
systems_of_record:
  - EspoCRM is the lead and tour record.
  - BookStack is the approved SOP record.
  - The external payment processor and bank remain financial records.
components:
  - tool_id: caddy
    role_in_stack: TLS termination and reverse proxy
    required: true
  - tool_id: vaultwarden
    role_in_stack: Staff credential vault
    required: true
  - tool_id: bookstack
    role_in_stack: SOP and member FAQ source
    required: true
  - tool_id: uptime-kuma
    role_in_stack: Service availability checks
    required: true
  - tool_id: restic
    role_in_stack: Encrypted offsite-capable backups
    required: true
  - tool_id: espocrm
    role_in_stack: Tour and sales pipeline record
    required: true
  - tool_id: listmonk
    role_in_stack: Optional newsletter delivery through approved SMTP
    required: false
  - tool_id: freescout
    role_in_stack: Optional shared support inbox
    required: false
data_flow:
  - Staff enter tour leads in EspoCRM and record consent before any newsletter export.
  - Caddy routes encrypted traffic to internal services; administrative routes require restricted access.
  - Restic encrypts application data and sends copies to storage outside the primary server.
implementation_order: [define-record-boundaries, deploy-caddy, deploy-vaultwarden, deploy-bookstack, configure-restic, prove-restore, deploy-uptime-kuma, pilot-espocrm, add-optional-messaging]
cost_assumptions:
  monthly_cash: Edit before adoption; expect infrastructure, domain, offsite storage, and delivery charges rather than software license fees.
  setup_labor: Several focused technical sessions plus staff process mapping; do not treat setup time as free.
  maintenance_labor: Reserve a recurring weekly patch and review window and a quarterly recovery exercise.
  messaging_email_sms: Transactional email needs an approved delivery service; SMS is outside the base stack and usage-funded.
  hosting_storage: One modest host may pilot the stack, but backups must use a separate provider or physical boundary.
  notes:
    - Near-zero describes license cash, not total cost of ownership.
    - Replace assumptions with local quotes before production use.
  pricing_sources: []
human_owners: [owner-operator for process and data decisions, technical-operator for hosting and recovery, operations-manager for daily data quality]
security_boundaries:
  - Keep payment card data out of every self-hosted application.
  - Restrict admin interfaces and maintain tested break-glass credentials.
  - Obtain human approval before bulk email or destructive automation.
backup_and_recovery:
  - Back up databases, attachments, and configuration to a separate boundary.
  - Test one item restore monthly and a complete service restore quarterly.
  - Keep a printed outage procedure and current credential escrow.
assumptions:
  - A named person can maintain Linux and containers.
  - Manual payment reconciliation is acceptable during the pilot.
risks:
  - A single-host outage can interrupt several workflows.
  - Labor and email-delivery costs can exceed a small SaaS subscription.
getting_started: [inventory-current-records, choose-one-pilot-workflow, deploy-with-test-data, prove-backup-restore, train-staff-before-member-data]
pilot_plan:
  - Run tour tracking and the SOP library with test data for two weeks.
  - Restore the pilot to a clean host before adding member data.
rollout_30_day:
  - Publish ownership, retention, incident, and change procedures.
  - Move one live workflow at a time with a rollback window.
maturity_90_day:
  - Complete a recovery drill and remove abandoned accounts.
  - Compare labor and incident burden with a hosted alternative.
exit_strategy:
  - Export CRM records and SOPs in documented portable formats.
  - Retain encrypted final backups according to the retention policy, then destroy excess copies.
commercial_fallback:
  - Move memberships and billing to an evaluated coworking SaaS if maintenance exceeds capacity.
  - Use managed hosting or a support partner before leaving unmaintained services online.
verification:
  last_reviewed: 2026-07-18
  notes: Planning architecture; local infrastructure and labor assumptions require operator review.
