schema_version: 1.0.0
id: multi-location-operator
name: Multi-Location Operator
tagline: Standardize core records while preserving accountable local operations
description: A governed multi-site architecture for shared memberships, payments, reporting, procedures, network standards, and rollout controls without erasing local ownership or exceptions.
audience_roles: [multi-location-operator, operations-manager, finance, facilities, technical-operator]
problems_solved: [multi-location-consistency, integrate-stack, measure-utilization, disaster-recovery]
workflows: [multi-site-rollout, reporting-kpis, member-onboarding, access-provisioning, backup-restore-drill]
monthly_cash_budget_band: flexible
self_host_heavy: false
operator_profile: An established operator adding or governing several sites with central standards and named local accountable leads.
number_of_locations: Three or more locations, introduced to the stack in controlled waves.
team_size: Ten or more staff with central operations, finance, technical, and local site roles.
products_offered: [multi-site-memberships, local-memberships, day-passes, desks, meeting-rooms, private-offices]
technical_skill_required: Moderate to high; enterprise SaaS administration, integrations, reporting, networks, migration, and continuity.
tasks_covered: [shared-membership-administration, cross-site-booking, centralized-payments, location-reporting, sop-standardization, network-baselining, rollout-governance]
tasks_not_covered: [local-staffing, lease-management, statutory-consolidation, physical-emergency-response, local-regulatory-judgment, culture-and-community-leadership]
systems_of_record:
  - Nexudus is the shared member, product, entitlement, and booking authority.
  - Stripe is the payment transaction authority where configured.
  - BookStack is the approved standard and local exception record.
components:
  - tool_id: nexudus
    role_in_stack: Multi-site coworking operations authority
    required: true
  - tool_id: stripe
    role_in_stack: Payment processing authority
    required: true
  - tool_id: metabase
    role_in_stack: Approved cross-location reporting from exports
    required: true
  - tool_id: bookstack
    role_in_stack: Shared SOPs and documented local exceptions
    required: true
  - tool_id: unifi-network
    role_in_stack: Repeatable network operations baseline
    required: false
  - tool_id: uptime-kuma
    role_in_stack: Location portal and service monitoring
    required: true
data_flow:
  - Locations maintain member and booking facts in Nexudus using centrally governed products and location codes.
  - Stripe transactions reconcile to the finance process; read-only approved exports feed Metabase.
  - Central SOPs publish through BookStack and local leads record approved exceptions with owners and review dates.
implementation_order: [define-global-and-local-ownership, standardize-location-codes, clean-core-data, configure-pilot-site, test-payments-and-exports, publish-sops, baseline-monitoring, migrate-wave-by-wave]
cost_assumptions:
  monthly_cash: Edit with current quotes by location, users, members, transactions, reporting, network support, hosting, and backup needs.
  setup_labor: Budget discovery per site, standard design, data cleanup, integration, migration rehearsal, training, and travel.
  maintenance_labor: Fund central administration, local data stewardship, exception handling, vendor review, and recovery exercises.
  messaging_email_sms: Model delivery by location and volume; preserve consent and local quiet-hour rules.
  hosting_storage: SaaS retention and export terms need review; reporting, SOP, monitoring, and network backups need separate storage.
  notes:
    - Shared software does not remove local operational accountability.
    - Evaluate total cost by location and workflow rather than one headline subscription.
  pricing_sources: []
human_owners: [central-operations for standards, local-site-leads for execution, finance for reconciliation, technical-operator for integrations, owner-operator for vendor risk]
security_boundaries:
  - Apply location-scoped least privilege and tightly control cross-site exports.
  - Separate central administration, local operations, member, network, and reporting access.
  - Human owners approve local exceptions, refunds, access changes, and incident severity.
backup_and_recovery:
  - Maintain scheduled central exports and separate backups for supporting services and configuration.
  - Give every site a current-day offline operations pack and central escalation path.
  - Test one-site outage quarterly and broader vendor unavailability annually.
assumptions:
  - Leadership will enforce shared identifiers and record boundaries.
  - Each location has a trained accountable lead and reliable connectivity.
risks:
  - Central misconfiguration can propagate errors across every location.
  - Excessive standardization can hide important local legal or service differences.
getting_started: [inventory-site-variation, choose-pilot-location, define-canonical-fields, test-full-export, run-pilot, review-before-next-wave]
pilot_plan:
  - Use one representative location and a limited product set.
  - Test cross-site entitlement, booking, payment, reporting, outage, and local exception handling.
rollout_30_day:
  - Migrate the first wave with daily reconciliation and a staffed rollback window.
  - Publish central support, local ownership, and change-freeze procedures.
maturity_90_day:
  - Review data quality, permission scope, location comparisons, exceptions, outages, and support load.
  - Approve the next rollout wave only after unresolved high-impact findings close.
exit_strategy:
  - Maintain location-coded exports and a tested neutral data dictionary.
  - Sequence site migrations to preserve bookings, payments, and local service continuity.
commercial_fallback:
  - Use vendor professional services for high-risk migrations or integration failures.
  - Evaluate another multi-site coworking platform through one-site acceptance and export tests.
verification:
  last_reviewed: 2026-07-18
  notes: Site-specific legal, finance, network, and continuity requirements require local review.
